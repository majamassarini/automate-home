# This file is managed by 'fullsend repos': repos-config-v1
# Do not edit this file directly; changes will be overwritten.
runtime: pi
roles:
    - triage
    - coder
    - review
    - fix
agents:
    - name: triage
      source: https://raw.githubusercontent.com/majamassarini/fullsend-config/b6ccddb3ba63eb8c80ea23eae0f0bcebc5bf590d/harness/triage.yaml#sha256=cc4bf8f08f0b3bdf6b296123b53b7e1f5cf7babd85f9a5a13c33642ea326fb5f
      model: google-vertex/gemini-3.8-flash
      trigger: |-
        event.entity.kind == "work_item" && ((event.transition.kind == "comment_added"

             && has(event.transition.comment.command)
             && event.transition.comment.command == "/fs-triage"
             && event.actor.kind == "human")
            || (event.transition.kind == "label_changed"
                && event.transition.label.name == "ready-for-triage"
                && event.transition.label.action == "added"))
    - name: code
      source: https://raw.githubusercontent.com/majamassarini/fullsend-config/b6ccddb3ba63eb8c80ea23eae0f0bcebc5bf590d/harness/code.yaml#sha256=2248f18c97a8a85c1cb2d756569014c9214aa6629224d6d2a6fcd606b61ae7e2
      model: google-vertex/gemini-3.8-flash
    - name: fix
      source: https://raw.githubusercontent.com/majamassarini/fullsend-config/b6ccddb3ba63eb8c80ea23eae0f0bcebc5bf590d/harness/fix.yaml#sha256=d6890a592c11981b7d561912c6a112c5507f1875e7f26f4a21eaf888b48d0ffb
      model: google-vertex/gemini-3.8-flash
    - name: review
      source: https://raw.githubusercontent.com/majamassarini/fullsend-config/b6ccddb3ba63eb8c80ea23eae0f0bcebc5bf590d/harness/review.yaml#sha256=758b4d7876de0707fd8dd90d5c1e159939dcdd823248484d548e2b6d0c477187
      model: google-vertex/gemini-3.8-flash
      subagents:
        challenger: google-vertex/gemini-3.8-flash
        correctness: google-vertex/gemini-3.8-flash
        cross-repo-contracts: google-vertex/gemini-3.8-flash
        docs-currency: google-vertex/gemini-3.8-flash
        intent-coherence: google-vertex/gemini-3.8-flash
        risk-assessment: google-vertex/gemini-3.8-flash
        security: google-vertex/gemini-3.8-flash
        security-triage: google-vertex/gemini-3.5-flash-lite
        style-conventions: google-vertex/gemini-3.8-flash
        user-experience: google-vertex/gemini-3.8-flash
      trigger: |-
        (event.transition.kind == "comment_added"

         && has(event.entity.linked_change_proposal)
         && has(event.transition.comment.command)
         && event.transition.comment.command == "/fs-review"
         && event.actor.kind == "human")
        || (event.entity.kind == "change_proposal"

            && event.transition.kind == "label_changed"
            && event.transition.label.name == "ready-for-review"
            && event.transition.label.action == "added")
    - name: retro
      enabled: false
    - name: prioritize
      enabled: false
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
    - https://raw.githubusercontent.com/majamassarini/fullsend-config/
    - https://github.com/majamassarini/fullsend-config/
create_issues:
    allow_targets:
        repos:
            - majamassarini/homino
            - majamassarini/automate-home
            - majamassarini/automate-ws
            - majamassarini/knx-stack
            - majamassarini/lifx-lib
            - majamassarini/automate-knx-plugin
            - majamassarini/automate-home-assistant-plugin
            - majamassarini/automate-sonos-plugin
            - majamassarini/automate-lifx-plugin
            - majamassarini/automate-prometheus-exporter
            - fullsend-ai/fullsend
mint_url: https://fullsend-mint-nbfspp6jda-uc.a.run.app
inference:
    project: automate-home-gcp
    region: global
    wif_provider: projects/250963846406/locations/global/workloadIdentityPools/fullsend-inference/providers/github-oidc
