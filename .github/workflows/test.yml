name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  code-quality: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"

    - name: Run unit tests with coverage
      run: |
        python -m coverage run -m unittest discover -s home/tests -t . -v

    - name: Run behave tests with coverage
      run: |
        python -m coverage run --append -m behave home/features/

    - name: Generate coverage report
      run: |
        python -m coverage report -m
        python -m coverage html
        python -m coverage xml

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/

    - name: Report coverage to GitHub Code Quality
      if: matrix.python-version == '3.14' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      uses: actions/upload-code-coverage@v1
      with:
        file: coverage.xml
        language: Python
        label: code-coverage/unittest-behave

  docs:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.14
      uses: actions/setup-python@v4
      with:
        python-version: "3.14"

    - name: Install doc dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[doc]"

    - name: Build documentation
      run: make -C docs html

    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: docs/build/html/
